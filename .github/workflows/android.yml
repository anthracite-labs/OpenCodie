name: android
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash

jobs:
  runtime:
    name: Prepare reusable OpenCode + Termux runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore last verified native runtime
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/runtime-aarch64.zip
            app/src/main/assets/runtime.sha256
            app/src/main/assets/runtime.version
          key: runtime-v1-${{ runner.os }}-${{ hashFiles('runtime.lock', 'scripts/build-opencode.sh', 'scripts/build-natives.sh', 'scripts/build-runtime.sh', 'scripts/check-elf.sh', 'scripts/opencode-wrapper.sh', 'scripts/patch-opentui-loader.py', 'patches/**') }}
      - name: Install native build tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zip unzip xz-utils binutils curl
          rustup target add aarch64-linux-android
          curl -fsSL https://bun.sh/install | bash -s bun-v1.4.4
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = 1.4.4
          wget -q https://dl.google.com/android/repository/android-ndk-r28b-linux.zip -O /tmp/ndk.zip
          sudo unzip -q /tmp/ndk.zip -d /opt
          sudo mv /opt/android-ndk-r28b /opt/android-ndk
          rm /tmp/ndk.zip
      - name: Build native runtime
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          ANDROID_NDK_HOME: /opt/android-ndk
          ANDROID_API: "29"
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.bun/bin:$PATH"
          bash scripts/build-opencode.sh 2>&1 | tee native.log
          bash scripts/build-runtime.sh 2>&1 | tee -a native.log
      - name: Verify cached or newly-built runtime
        run: |
          set -euo pipefail
          ASSETS=app/src/main/assets
          test -s "$ASSETS/runtime-aarch64.zip"
          test -s "$ASSETS/runtime.sha256"
          test -s "$ASSETS/runtime.version"
          printf '%s  %s\n' "$(cat "$ASSETS/runtime.sha256")" "$ASSETS/runtime-aarch64.zip" | sha256sum -c -
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile("app/src/main/assets/runtime-aarch64.zip") as z:
              required={"SYMLINKS.txt","bin/bash","bin/pkg","bin/apt","bin/dpkg","bin/rg","var/lib/dpkg/status","lib/libc++_shared.so","bin/opencode","libexec/opencode/opencode.bin"}
              missing=required-set(z.namelist())
              assert not missing, f"Runtime missing: {sorted(missing)}"
              assert z.testzip() is None, "Corrupt runtime archive"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-runtime
          path: app/src/main/assets/runtime*
          if-no-files-found: error
          retention-days: 14
      - name: Upload native diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-failure-log
          path: native.log
          if-no-files-found: ignore
      - name: Report native failure
        if: failure()
        run: |
          [ -f native.log ] || { echo "::error::native.log was not created"; exit 0; }
          { grep -n -i -E "error|fail|cannot|no such|not found|denied" native.log | tail -6 || true
            echo "--- last lines ---"
            tail -n 6 native.log
          } | cut -c1-400 | while IFS= read -r line; do
            echo "::error::$line"
          done

  apk:
    name: Assemble and verify APK
    needs: runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Select installed Android SDK
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms"
          PLATFORM=$(find "$ANDROID_HOME/platforms" -mindepth 1 -maxdepth 1 -type d -name 'android-[0-9]*' | sed 's@.*/android-@@' | sort -n | tail -1)
          test -n "$PLATFORM" && test -s "$ANDROID_HOME/platforms/android-$PLATFORM/android.jar"
          echo "OPENCODIE_COMPILE_SDK=$PLATFORM" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: prepared-runtime
          path: app/src/main/assets
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure signing key
        env:
          STORE_BASE64: ${{ secrets.OPENCODIE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OPENCODIE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENCODIE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPENCODIE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          FILE="$RUNNER_TEMP/opencodie.jks"
          if [ -n "$STORE_BASE64" ]; then
            printf %s "$STORE_BASE64" | base64 -d > "$FILE"
            test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS"
            KEY_PASSWORD="${KEY_PASSWORD:-$STORE_PASSWORD}"
          else
            echo "::warning::Temporary signing key; use secrets for upgradeable APKs."
            STORE_PASSWORD=opencodie
            KEY_ALIAS=opencodie
            KEY_PASSWORD=opencodie
            keytool -genkeypair -keystore "$FILE" -storetype PKCS12 -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OpenCodie"
          fi
          echo "OPENCODIE_KEYSTORE_FILE=$FILE" >> "$GITHUB_ENV"
          echo "OPENCODIE_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OPENCODIE_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "OPENCODIE_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Assemble release and debug APKs
        env:
          OPENCODIE_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug 2>&1 | tee build.log
      - name: Verify signed APK and bundled files
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          test -x "$BT/aapt2" && test -x "$BT/apksigner"
          "$BT/apksigner" verify --print-certs "$APK" | tee verification.log
          "$BT/aapt2" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.termux'" "$RUNNER_TEMP/badging.txt"
          "$BT/aapt2" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/manifest.txt"
          python3 - "$RUNNER_TEMP/manifest.txt" <<'PY'
          import re,sys
          data=open(sys.argv[1]).read()
          for label,expected in (("minSdkVersion",29),("targetSdkVersion",28)):
              m=re.search(r"android:"+label+r"\b[^\n]*\(type 0x10\)0x([0-9a-fA-F]+)",data)
              if not m: raise SystemExit(f"Manifest missing {label}")
              if int(m.group(1),16)!=expected: raise SystemExit(f"Wrong {label}: {int(m.group(1),16)} != {expected}")
          print("Verified minSdk 29 / targetSdk 28")
          PY
          unzip -p "$APK" assets/runtime-aarch64.zip > "$RUNNER_TEMP/runtime.zip"
          unzip -p "$APK" assets/runtime.sha256 > "$RUNNER_TEMP/runtime.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/runtime.sha256")" "$RUNNER_TEMP/runtime.zip" | sha256sum -c -
          python3 - "$RUNNER_TEMP/runtime.zip" "$RUNNER_TEMP/opencode.bin" <<'PY'
          import sys,zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              required={"SYMLINKS.txt","bin/pkg","bin/apt","bin/dpkg","bin/bash","bin/rg","var/lib/dpkg/status","lib/libc++_shared.so","bin/opencode","libexec/opencode/opencode.bin"}
              missing=required-set(z.namelist())
              if missing: raise SystemExit(f"Missing runtime files: {sorted(missing)}")
              with open(sys.argv[2],"wb") as out: out.write(z.read("libexec/opencode/opencode.bin"))
          PY
          readelf -h "$RUNNER_TEMP/opencode.bin" | tee -a verification.log
          readelf -h "$RUNNER_TEMP/opencode.bin" | grep -q 'Machine:.*AArch64'
          if readelf -d "$RUNNER_TEMP/opencode.bin" | grep -E 'NEEDED.*(libc\.so\.6|ld-musl|libc\.musl)'; then
            echo "::error::Non-Android libc linked"; exit 1
          fi
          sha256sum "$APK" | tee -a verification.log
      - name: Upload APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencodie-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Report build failure
        if: failure()
        run: |
          [ -f build.log ] || { echo "::error::build.log was not created"; exit 0; }
          { grep -n -i -E "error|fail|cannot|not found|unresolved|what went wrong" build.log | tail -8 || true
            echo "--- last lines ---"
            tail -n 8 build.log
          } | cut -c1-400 | while IFS= read -r line; do
            echo "::error::$line"
          done
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencodie-build-log
          path: |
            build.log
            verification.log
            app/build/outputs/logs/
          if-no-files-found: ignore
