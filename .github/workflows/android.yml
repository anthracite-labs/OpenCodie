name: android

# Builds the APK: OpenCode (Android/Bionic) -> Termux runtime -> Gradle.
# The app needs the Android SDK, NDK, Rust and Bun, so the APK is assembled here.
on:
  workflow_dispatch:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  ANDROID_NDK_VERSION: r28b
  ANDROID_NDK_HOME: /opt/android-ndk
  ANDROID_API: "29"

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /opt/microsoft
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: Install Android SDK
        run: |
          set -euo pipefail
          exec > >(tee -a ci.log) 2>&1
          # Use the SDK preinstalled on the runner image instead of a setup action.
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >>"$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >>"$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >>"$GITHUB_PATH"
          echo "$SDK/platform-tools" >>"$GITHUB_PATH"
          export PATH="$SDK/cmdline-tools/latest/bin:$PATH"
          sdkmanager --version || true
          sdkmanager --licenses </dev/null >/dev/null || true
          echo "available platforms:"
          sdkmanager --list 2>/dev/null | grep -oE "platforms;android-[0-9]+" | sort -uV | tail -8
          # Highest platform we can install; the pinned one when it exists.
          TARGET="platforms;android-37"
          sdkmanager --install "$TARGET" "platform-tools" || sdkmanager --install "$TARGET" --channel=3 || true
          INSTALLED=$(sdkmanager --list_installed 2>/dev/null | grep -oE "platforms;android-[0-9]+" | sort -uV | tail -1)
          if [ -z "$INSTALLED" ]; then
            FALLBACK=$(sdkmanager --list 2>/dev/null | grep -oE "platforms;android-[0-9]+" | sort -uV | tail -1)
            sdkmanager --install "$FALLBACK" "platform-tools"
            INSTALLED=$FALLBACK
          fi
          echo "OPENCODIE_COMPILE_SDK=${INSTALLED##*-}" >>"$GITHUB_ENV"
          echo "using $INSTALLED"
          sdkmanager --list_installed 2>/dev/null | grep -E "platforms|build-tools" | head -10

      - name: Install Android NDK ${{ env.ANDROID_NDK_VERSION }}
        run: |
          exec > >(tee -a ci.log) 2>&1
          wget -q "https://dl.google.com/android/repository/android-ndk-${ANDROID_NDK_VERSION}-linux.zip" -O /tmp/ndk.zip
          sudo mkdir -p /opt
          sudo unzip -q /tmp/ndk.zip -d /opt
          sudo mv "/opt/android-ndk-${ANDROID_NDK_VERSION}" "$ANDROID_NDK_HOME"
          rm -f /tmp/ndk.zip

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip xz-utils binutils curl

      - name: Install Rust Android target
        run: |
          rustup target add aarch64-linux-android
          rustc --version

      - name: Install Bun 1.4.4
        run: |
          exec > >(tee -a ci.log) 2>&1
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.4"
          echo "$HOME/.bun/bin" >>"$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          test "$(bun --version)" = "1.4.4"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENCODIE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.OPENCODIE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OPENCODIE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OPENCODIE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "using repository signing keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$RUNNER_TEMP/opencodie.jks"
            echo "OPENCODIE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >>"$GITHUB_ENV"
            echo "OPENCODIE_KEY_ALIAS=$KEY_ALIAS" >>"$GITHUB_ENV"
            echo "OPENCODIE_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}" >>"$GITHUB_ENV"
          else
            # No repository keystore: sign with a throwaway one so the artifact is
            # installable. A stable identity for updates needs the secrets above.
            echo "no keystore secret, generating an ephemeral signing key"
            keytool -genkeypair -keystore "$RUNNER_TEMP/opencodie.jks" -storetype PKCS12 \
              -storepass opencodie -keypass opencodie -alias opencodie \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=OpenCodie"
            echo "OPENCODIE_KEYSTORE_PASSWORD=opencodie" >>"$GITHUB_ENV"
            echo "OPENCODIE_KEY_ALIAS=opencodie" >>"$GITHUB_ENV"
            echo "OPENCODIE_KEY_PASSWORD=opencodie" >>"$GITHUB_ENV"
          fi
          echo "OPENCODIE_KEYSTORE_FILE=$RUNNER_TEMP/opencodie.jks" >>"$GITHUB_ENV"

      - name: Build APK
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OPENCODIE_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash scripts/build-release.sh 2>&1 | tee build.log
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee -a build.log

      - name: Verify APK
        run: |
          set -euo pipefail
          exec > >(tee -a ci.log) 2>&1
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^native-code|^application-label" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.termux'" "$RUNNER_TEMP/badging.txt"
          grep -q "targetSdkVersion:'28'" "$RUNNER_TEMP/badging.txt"
          grep -q "sdkVersion:'29'" "$RUNNER_TEMP/badging.txt"
          grep -q "native-code: 'arm64-v8a'" "$RUNNER_TEMP/badging.txt"
          unzip -l "$APK" | grep -q "assets/runtime-aarch64.zip"
          RUNTIME=$(unzip -l "$APK" | awk '/assets\/runtime-aarch64.zip/{print $1}')
          test "$RUNTIME" -gt 30000000
          "$BT/apksigner" verify --print-certs "$APK" | head -3 | tee "$RUNNER_TEMP/signature.txt"
          {
            echo "APK: $APK"
            echo "size: $(du -h "$APK" | cut -f1)"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo "bundled runtime asset: $RUNTIME bytes"
            cat "$RUNNER_TEMP/badging.txt"
          } | tee "$RUNNER_TEMP/apk.txt"

      - name: Report APKs
        if: always()
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -lh {} \; || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencodie-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opencodie-build-log
          path: |
            build.log
            app/build/outputs/logs/*
          if-no-files-found: warn

      - name: Report APK facts
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "${PR_NUMBER:-}" ] || exit 0
          {
            echo "APK built and verified for $GITHUB_SHA."
            echo
            echo '```'
            cat "$RUNNER_TEMP/apk.txt"
            echo '```'
          } >"$RUNNER_TEMP/facts.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/facts.md" || true

      # Artifacts live in blob storage that not every client can read; failures
      # are also surfaced where the API exposes them.
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Android build failed for $GITHUB_SHA."
            echo
            for f in ci.log build.log; do
              [ -f "$f" ] || continue
              echo "<details><summary>$f (last 150 lines)</summary>"
              echo
              echo '```'
              tail -n 150 "$f"
              echo '```'
              echo "</details>"
            done
          } >"$RUNNER_TEMP/comment.md"
          grep -i -m 5 "error:" ci.log build.log 2>/dev/null | sed 's/^/::error::/' || true
          if [ -n "${PR_NUMBER:-}" ]; then
            gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md" || true
          fi
