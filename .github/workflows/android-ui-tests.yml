name: Android UI regression (emulator)

on:
  pull_request:
    paths:
      - 'app/**'
      - 'patches/opencode-mobile-ui.patch'
      - 'tests/ANDROID_ACCEPTANCE.md'
      - '.github/workflows/android-ui-tests.yml'
  workflow_dispatch:

concurrency:
  group: android-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  connected-ui:
    name: Connected UI • Android 15
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install compile SDK
        uses: ./.github/actions/setup-android-sdk
        with:
          packages: 'platforms;android-37.0 build-tools;37.0.0'
      - name: Enable Linux KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # API 35 Google APIs images support ARM64 ABI translation on many x86_64
      # hosts. Keep the real ARM64 device matrix documented separately.
      - name: Run Android instrumentation tests and capture welcome screen
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            if ./gradlew --no-daemon :app:connectedDebugAndroidTest; then
              result=0
            else
              result=$?
            fi
            mkdir -p app/build/ui-captures
            # Preserve the actual on-screen state before restarting the app.
            adb exec-out screencap -p > app/build/ui-captures/after-tests.png || true
            if [ "$result" -ne 0 ]; then
              exit "$result"
            fi
            adb shell am force-stop com.termux
            adb shell am start -n com.termux/.MainActivity
            sleep 2
            adb exec-out screencap -p > app/build/ui-captures/welcome.png
      - name: Upload Android UI test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-ui-regression
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            app/build/ui-captures/**
